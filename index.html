
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOOM 2027 🌸</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:white;background:#24132e;overflow:hidden
}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.shade{position:fixed;inset:0;background:rgba(20,5,30,.18);z-index:-1}
.card{
 width:88%;max-width:420px;padding:42px 26px;text-align:center;
 border-radius:30px;background:rgba(255,255,255,.32);
 backdrop-filter:blur(30px) saturate(180%);
 -webkit-backdrop-filter:blur(30px) saturate(180%);
 border:1px solid rgba(255,255,255,.65);
 box-shadow:0 15px 50px rgba(20,10,40,.15),inset 0 1px 2px rgba(255,255,255,.7);
 animation:appear 1s ease
}
h1{font-size:34px;line-height:1.2}
p{line-height:1.7}
input,button{
 width:100%;padding:16px;margin-top:12px;border-radius:16px;
 border:1px solid rgba(255,255,255,.65);
 background:rgba(255,255,255,.25);color:white;font-size:16px
}
input{text-align:center;outline:none}
input::placeholder{color:white}
button{cursor:pointer;font-weight:600}
button:disabled{opacity:.6}
#status{font-size:13px}
@keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="background.mp4" type="video/mp4">
</video>
<div class="shade"></div>

<main class="card">
 <div style="font-size:38px">🌸 ✨ 🌷</div>
 <h1>A Little Surprise Awaits You.</h1>
 <p>Something magical is blooming...<br>Enter your name to discover your surprise.</p>
 <input id="visitorName" maxlength="50" placeholder="Enter your name..." autocomplete="given-name">
 <button id="unlock" onclick="openWish()">Unlock My Surprise ✨</button>
 <p id="status"></p>
</main>

<script>
async function openWish(){
 const name=document.getElementById("visitorName").value.trim();
 const button=document.getElementById("unlock");
 const status=document.getElementById("status");

 if(!name){status.textContent="Please enter your name 🌸";return;}

 button.disabled=true;
 status.textContent="Preparing your magical surprise... ✨";

 try{
  const url="https://lqoolbnlzbsubtyimsdm.supabase.co";
  const key="sb_publishable_NlKfNnaVEv8im3b1SZbRPg_-BlleVje";

  const response=await fetch(url+"/rest/v1/rpc/get_or_assign_wish",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":key,
    "Authorization":"Bearer "+key
   },
   body:JSON.stringify({
    p_name:name,
    p_message_count:5
   })
  });

  if(!response.ok) throw new Error("Database connection failed");

  const index=await response.json();
  if(!Number.isInteger(index)||index<1||index>5)
   throw new Error("Invalid message assignment");

  window.location.href="wish.html?name="+encodeURIComponent(name);
 }catch(error){
  status.textContent="Please try again. Your surprise is waiting! 💜";
  button.disabled=false;
 }
}
 window.addEventListener("pageshow", function(){
  const button = document.getElementById("unlock");
  const status = document.getElementById("status");

  button.disabled = false;
  status.textContent = "";
});
</script>
 
<audio id="bloomMusic" loop preload="auto">
  <source src="bloom-music.mp4" type="audio/mp4">
</audio>

<button id="musicToggle" class="music-toggle"
onclick="toggleBloomMusic()" type="button">
  ♫ Play Music
</button>

<style>
.music-toggle {
  position: fixed;
  bottom: 24px;
  right: 18px;
  width: auto;
  z-index: 10;
  padding: 13px 20px;
  border-radius: 30px;
  color: white;
  background: rgba(255,255,255,.32);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.65);
  box-shadow: 0 5px 20px rgba(20,10,40,.15);
  font-size: 14px;
}
</style>

<script>
const music = document.getElementById("bloomMusic");
const musicToggle = document.getElementById("musicToggle");

async function startMusic() {
  try {
    await music.play();
    sessionStorage.setItem("bloomMusicOn", "yes");
    musicToggle.textContent = "♫ Pause Music";
  } catch (error) {
    musicToggle.textContent = "♫ Tap to Play";
  }
}

musicToggle.addEventListener("click", async () => {
  if (music.paused) {
    await startMusic();
  } else {
    music.pause();
    sessionStorage.setItem("bloomMusicOn", "no");
    musicToggle.textContent = "♫ Play Music";
  }
});

// Automatically resume music on page load
if (sessionStorage.getItem("bloomMusicOn") === "yes") {
  startMusic();
}
 
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your BLOOM 2027 Wish 🌸</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:white;background:#24132e;overflow:hidden
}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.shade{position:fixed;inset:0;background:rgba(20,5,30,.18);z-index:-1}
.card{
 width:88%;max-width:430px;padding:42px 26px;text-align:center;
 border-radius:30px;background:rgba(255,255,255,.32);
 backdrop-filter:blur(30px) saturate(180%);
 -webkit-backdrop-filter:blur(30px) saturate(180%);
 border:1px solid rgba(255,255,255,.65);
 box-shadow:0 15px 50px rgba(20,10,40,.15),inset 0 1px 2px rgba(255,255,255,.7);
 animation:appear 1.2s ease
}
h1{font-size:32px;line-height:1.3}
#wish{font-size:19px;line-height:1.8}
.flower{font-size:36px}
#status{font-size:14px}
@keyframes appear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="background.mp4" type="video/mp4">
</video>
<div class="shade"></div>

<main class="card">
 <div class="flower">🌸 ✨ 🌷</div>
 <h1 id="heading">A beautiful wish is blooming...</h1>
 <p id="wish">Please wait while we prepare your surprise.</p>
 <div class="flower">💜</div>
 <p id="status"></p>
</main>

<script>

const messages=[
 "May the New Year bring you peace in your heart, love in your life, and endless reasons to smile. Wishing you happiness in every little moment. ❤️✨",

 "As a new chapter begins, may your days be lighter, your dreams feel closer, and your heart be filled with hope. Happy New Year! 🌙🤍",

 "Wishing you a year full of gentle beginnings, beautiful memories, good health, and all the love you deserve. Happy New Year! 💖",

 "May this New Year heal what needs healing, strengthen what matters, and bring you closer to the life you truly wish for. ✨❤️",

 "Here’s to new hopes, kind moments, and a year that treats you with all the softness and happiness you deserve. Happy New Year! 🥂💫"
];
 

// Add custom messages here later.
const customMessages={
 // "rudram":"Your special personal message here."
};

async function loadWish(){
 const params=new URLSearchParams(location.search);
 const name=(params.get("name")||"Friend").trim().slice(0,50);
 const heading=document.getElementById("heading");
 const wish=document.getElementById("wish");
 const status=document.getElementById("status");

 heading.textContent="Happy New Year 2027, "+name+"! 🌸";

 try{
  const url="https://lqoolbnlzbsubtyimsdm.supabase.co";
  const key="sb_publishable_NlKfNnaVEv8im3b1SZbRPg_-BlleVje";

  const response=await fetch(url+"/rest/v1/rpc/get_or_assign_wish",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":key,
    "Authorization":"Bearer "+key
   },
   body:JSON.stringify({
    p_name:name,
    p_message_count:messages.length
   })
  });

  if(!response.ok) throw new Error("Could not retrieve your wish");

  const index=await response.json();
  if(!Number.isInteger(index)||index<1||index>messages.length)
   throw new Error("Invalid message");

  const custom=customMessages[name.toLowerCase()];
  wish.textContent=custom||messages[index-1];

 }catch(error){
  wish.textContent="Your beautiful surprise is temporarily unavailable. Please try again. 💜";
  status.textContent="Connection issue. Please refresh the page.";
 }
}

loadWish();
</script>
 
<audio id="bloomMusic" loop preload="auto">
  <source src="bloom-music.mp4" type="audio/mp4">
</audio>

<button id="musicToggle" class="music-toggle" type="button">
  ♫ Play Music
</button>

<style>
.music-toggle {
  position: fixed;
  bottom: 24px;
  right: 18px;
  width: auto;
  z-index: 10;
  padding: 13px 20px;
  border-radius: 30px;
  color: white;
  background: rgba(255,255,255,.32);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.65);
  box-shadow: 0 5px 20px rgba(20,10,40,.15);
  font-size: 14px;
}
</style>

<script>

const music = document.getElementById("bloomMusic");
const musicToggle = document.getElementById("musicToggle");

async function startMusic() {
  try {
    await music.play();
    sessionStorage.setItem("bloomMusicOn", "yes");
    musicToggle.textContent = "♫ Pause Music";
  } catch (error) {
    musicToggle.textContent = "♫ Tap to Play";
  }
}

musicToggle.addEventListener("click", async () => {
  if (music.paused) {
    await startMusic();
  } else {
    music.pause();
    sessionStorage.setItem("bloomMusicOn", "no");
    musicToggle.textContent = "♫ Play Music";
  }
});

// Automatically resume music on page load
if (sessionStorage.getItem("bloomMusicOn") === "yes") {
  startMusic();
}
 

</script>
</body>
</html>
